<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#f4d928">
  <title>Clip Brain · 24h Clipboard</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./components.css">
  <link rel="stylesheet" href="./selection-menu.css">
</head>
<body>
  <div class="ink ink-a" aria-hidden="true"></div>
  <div class="ink ink-b" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand-lockup">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <path d="M18 17h28v34H18z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
          <path d="M25 12h14a4 4 0 0 1 4 4v6H21v-6a4 4 0 0 1 4-4z" fill="currentColor"/>
          <path d="M25 34c3-5 11-5 14 0m-16 8c5 5 13 5 18 0" fill="none" stroke="#15141d" stroke-width="4" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <p class="eyebrow">TEMPORARY DROP ZONE</p>
        <h1>CLIP BRAIN</h1>
        <p class="subtitle">文字和文件在 24 小时后自动焚毁。</p>
      </div>
    </div>

    <nav class="site-switch" aria-label="网站入口">
      <a class="wordmark mastodon-wordmark" href="/" aria-label="切换到 Mastodon">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <path d="M10 17c1-8 8-12 18-12s17 4 18 12v20c-1 9-9 13-18 13-8 0-14-2-17-6l1-8c4 4 9 6 15 6 7 0 10-3 10-7v-2c-3 2-6 3-10 3-10 0-17-4-17-13z" fill="currentColor"/>
          <path d="M18 19v13m0-10c0-4 7-4 7 0v10m0-10c0-4 7-4 7 0v10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>mastodon</span>
      </a>
      <a class="wordmark clip-wordmark" href="/clipboard/" aria-current="page" aria-label="Clip Brain 当前页面">
        <svg viewBox="0 0 56 56" aria-hidden="true">
          <rect x="12" y="10" width="32" height="38" rx="10" fill="none" stroke="currentColor" stroke-width="4"/>
          <path d="M21 20h14M21 28h14M21 36h9" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <span>clip brain</span>
      </a>
    </nav>
  </header>

  <main class="layout">
    <section class="composer-panel" aria-labelledby="drop-title">
      <div class="section-heading">
        <div>
          <p class="section-kicker">NEW DROP</p>
          <h2 id="drop-title">丢进来，明天自动消失</h2>
        </div>
        <span class="ttl-chip">TTL · 24H</span>
      </div>

      <form id="clip-form" novalidate>
        <label class="field-label" for="clip-text">文本</label>
        <textarea id="clip-text" maxlength="20000" placeholder="粘贴文字、代码、日志……最多 10000 个 Unicode 字符"></textarea>
        <div class="field-meta">
          <span id="text-count">0 / 10000</span>
          <span>保存后点击正文即可复制</span>
        </div>

        <label class="file-drop" for="clip-files">
          <input id="clip-files" type="file" multiple>
          <span class="file-drop-title">＋ 选择任意文件</span>
          <span class="file-drop-help">最多 30 个 · 文件合计不超过 1 GiB</span>
        </label>
        <div id="file-summary" class="file-summary">尚未选择文件</div>
        <ul id="draft-files" class="draft-files" aria-label="待保存文件"></ul>

        <div id="form-error" class="notice error" role="alert" hidden></div>
        <div id="form-status" class="notice success" role="status" hidden></div>

        <button id="save-button" class="save-button" type="submit">
          <span>保存 24 小时</span>
          <span aria-hidden="true">↗</span>
        </button>
      </form>
    </section>

    <section class="clips-panel" aria-labelledby="clips-title">
      <div class="section-heading clips-heading">
        <div>
          <p class="section-kicker">LIVE BOARD</p>
          <h2 id="clips-title">临时内容</h2>
        </div>
        <span id="clip-total" class="count-chip">0 条</span>
      </div>

      <div class="selection-bar">
        <label class="select-page-label">
          <input id="select-page" type="checkbox">
          <span>选择本页</span>
        </label>
        <div id="selection-menu" class="selection-menu" data-open="false" data-has-selection="false">
          <button id="selection-trigger" class="selection-trigger" type="button" aria-expanded="false" aria-controls="bulk-actions" disabled>
            <span id="selection-text">未选择条目</span>
            <span class="selection-caret" aria-hidden="true">⌄</span>
          </button>
          <div id="bulk-actions" class="bulk-actions" hidden>
            <button id="bulk-action" type="button">
              <span class="bulk-prefix">全部</span>
              <span id="bulk-copy-label" class="bulk-mode is-active">复制</span>
              <span class="bulk-divider">/</span>
              <span id="bulk-download-label" class="bulk-mode">下载</span>
            </button>
            <button id="bulk-destroy" type="button">全部焚毁</button>
          </div>
        </div>
      </div>

      <div id="empty-state" class="empty-state">
        <strong>这里还很干净。</strong>
        <span>保存第一条文本或文件，它会在 24 小时后自动清理。</span>
      </div>
      <div id="clip-list" class="clip-list" aria-live="polite"></div>

      <nav class="pagination" aria-label="临时内容分页">
        <button id="prev-page" type="button">上一页</button>
        <span id="page-label">1 / 1</span>
        <button id="next-page" type="button">下一页</button>
      </nav>
    </section>
  </main>

  <template id="clip-template">
    <article class="clip-card">
      <header class="clip-card-header">
        <label class="card-select-label">
          <input class="clip-select" type="checkbox">
          <span class="clip-type">DROP</span>
          <time class="clip-created"></time>
        </label>
        <span class="clip-countdown"></span>
      </header>
      <button class="clip-text" type="button" title="复制完整文本"></button>
      <ul class="clip-files"></ul>
      <footer class="clip-actions">
        <button class="copy-button" type="button">复制文本</button>
        <button class="entry-download" type="button">下载本条 ZIP</button>
        <button class="delete-button" type="button">立即焚毁</button>
      </footer>
    </article>
  </template>

  <script src="./storage.js"></script>
  <script src="./archive.js"></script>
  <script src="./downloads.js"></script>
  <script src="./bulk.js"></script>
  <script src="./selection-menu.js"></script>
  <script src="./view.js"></script>
  <script src="./app.js"></script>
</body>
</html>
