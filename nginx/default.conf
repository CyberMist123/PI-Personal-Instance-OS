map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_cf_connecting_ip $pi_client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

upstream mastodon_web {
  server web:3000;
  keepalive 16;
}

upstream mastodon_streaming {
  server streaming:4000;
  keepalive 16;
}

# Windows keeps the resident tokens under DPAPI. Docker Desktop's verified
# host.docker.internal bridge reaches this loopback-only host process without
# exposing the MCP port on the LAN.
upstream cmx_mcp {
  server host.docker.internal:8766;
  keepalive 8;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  client_max_body_size 100m;
  proxy_connect_timeout 30s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  location = /_pi/health {
    access_log off;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "PI OS OK\n";
  }

  location = /_pi/mcp-health {
    proxy_pass http://cmx_mcp/_cmx/mcp-health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ~ ^/\.well-known/oauth-protected-resource/mcp/[a-z0-9_-]+$ {
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ^~ /files/ {
    client_max_body_size 2g;
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ~ ^/(authorize|token|register|revoke|oauth/invite|mcp/[a-z0-9_-]+)$ {
    client_max_body_size 1m;
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location ^~ /api/v1/streaming {
    proxy_pass http://mastodon_streaming;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_redirect off;
    proxy_read_timeout 86400s;
    tcp_nodelay on;
  }

  location / {
    proxy_pass http://mastodon_web;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering on;
    proxy_redirect off;
    tcp_nodelay on;

    # CMX voice widget: sub_filter needs an uncompressed upstream response;
    # Cloudflare re-compresses toward visitors.
    proxy_set_header Accept-Encoding "";
    sub_filter '</body>' '<script src="/files/voice.js" defer></script></body>';
    sub_filter_once on;

    # CMX voice widget CSP relaxation. Mastodon 4.6.3 sends a strict CSP whose
    # script-src/style-src are pinned to per-response 'nonce-...'/'sha256-...'
    # allow-lists. Our injected same-origin widget script -- and the inline
    # styles it applies -- carry no such nonce, so the browser refuses them and
    # the recorder button never renders. We drop the upstream CSP and re-issue an
    # equally strict one that only relaxes script-src/style-src to
    # 'self' + 'unsafe-inline' (so BOTH Mastodon's own inline bits and our widget
    # run). Acceptable ONLY because this is a private, single-user instance with
    # no third-party or user-generated script surface. Every other directive
    # stays as strict as Mastodon's original: base-uri 'none', default-src 'none'
    # (which also keeps object-src 'none'), frame-ancestors 'none', form-action
    # 'none'. NOTE: this is the only add_header in this location; nginx
    # add_header inheritance is all-or-nothing per block, so any future add_header
    # added here must also re-declare this CSP header or it will be dropped.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "base-uri 'none'; default-src 'none'; frame-ancestors 'none'; form-action 'none'; font-src 'self' data: https://pi.ler428.xyz; img-src 'self' data: blob: https://pi.ler428.xyz; media-src 'self' data: blob: https://pi.ler428.xyz; manifest-src 'self' https://pi.ler428.xyz; child-src 'self' blob: https://pi.ler428.xyz; worker-src 'self' blob: https://pi.ler428.xyz; connect-src 'self' data: blob: https://pi.ler428.xyz wss://pi.ler428.xyz; frame-src 'self' https:; style-src 'self' 'unsafe-inline' https://pi.ler428.xyz; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://pi.ler428.xyz" always;
  }
}
