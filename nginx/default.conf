map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

map $http_cf_connecting_ip $pi_client_ip {
  default $http_cf_connecting_ip;
  ''      $remote_addr;
}

upstream mastodon_web {
  server web:3000;
  keepalive 16;
}

upstream mastodon_streaming {
  server streaming:4000;
  keepalive 16;
}

# Windows keeps the resident tokens under DPAPI. Docker Desktop's verified
# host.docker.internal bridge reaches this loopback-only host process without
# exposing the MCP port on the LAN.
upstream cmx_mcp {
  server host.docker.internal:8766;
  keepalive 8;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  client_max_body_size 100m;
  proxy_connect_timeout 30s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  location = /_pi/health {
    access_log off;
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    return 200 "PI OS OK\n";
  }

  location = /_pi/mcp-health {
    proxy_pass http://cmx_mcp/_cmx/mcp-health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location = /.well-known/oauth-authorization-server {
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location ~ ^/\.well-known/oauth-protected-resource/mcp/[a-z0-9_-]+$ {
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location = /clipboard {
    return 302 /clipboard/;
  }

  location = /clipboard-site-switch.js {
    alias /srv/clip-brain/site-switch.js;
    default_type application/javascript;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location ^~ /clipboard/ {
    alias /srv/clip-brain/;
    index index.html;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "base-uri 'none'; default-src 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; style-src 'self'; script-src 'self'; worker-src 'self' blob:" always;
  }

  # Clipboard's own API. The body cap sits deliberately ABOVE the 1 GiB
  # per-entry limit so an oversized upload is rejected by the application with
  # a JSON error the page can show, instead of by Nginx with a bare 413 page.
  location ^~ /clipboard-api/ {
    client_max_body_size 1200m;
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ^~ /files/ {
    client_max_body_size 2g;
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location ~ ^/(authorize|token|register|revoke|oauth/invite|mcp/[a-z0-9_-]+)$ {
    client_max_body_size 1m;
    proxy_pass http://cmx_mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  location ^~ /api/v1/streaming {
    proxy_pass http://mastodon_streaming;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_redirect off;
    proxy_read_timeout 86400s;
    tcp_nodelay on;
  }

  location / {
    proxy_pass http://mastodon_web;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $pi_client_ip;
    proxy_set_header X-Forwarded-For $pi_client_ip;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Proxy "";

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering on;
    proxy_redirect off;
    tcp_nodelay on;

    # CMX widgets: sub_filter needs an uncompressed upstream response;
    # Cloudflare re-compresses toward visitors.
    proxy_set_header Accept-Encoding "";
    sub_filter '</body>' '<script src="/files/voice.js" defer></script><script src="/files/search.js" defer></script><script src="/clipboard-site-switch.js" defer></script></body>';
    sub_filter_once on;

    # CMX widget CSP relaxation. Mastodon sends a strict CSP whose script-src /
    # style-src are pinned to per-response nonce / hash allow-lists. The injected
    # same-origin scripts and inline widget styles carry no nonce, so the browser
    # would reject them. This private single-user instance re-issues an otherwise
    # strict policy with only same-origin + inline script/style relaxed.
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "base-uri 'none'; default-src 'none'; frame-ancestors 'none'; form-action 'none'; font-src 'self' data: https://pi.ler428.xyz; img-src 'self' data: blob: https://pi.ler428.xyz; media-src 'self' data: blob: https://pi.ler428.xyz; manifest-src 'self' https://pi.ler428.xyz; child-src 'self' blob: https://pi.ler428.xyz; worker-src 'self' blob: https://pi.ler428.xyz; connect-src 'self' data: blob: https://pi.ler428.xyz wss://pi.ler428.xyz; frame-src 'self' https:; style-src 'self' 'unsafe-inline' https://pi.ler428.xyz; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://pi.ler428.xyz" always;
  }
}
