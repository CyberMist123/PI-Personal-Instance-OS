[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmx-mcp"
version = "0.3.0rc2"
description = "Token-efficient local and authenticated remote MCP for a private CMX instance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1,<2",
  "httpx>=0.27,<1",
  "rapidfuzz>=3,<4",
  "pypinyin>=0.55,<1",
]

[project.scripts]
cmx-mcp = "cmx_mcp.app:main"
cmx-admin = "cmx_mcp.cli:main"
cmx-smoke = "cmx_mcp.smoke:main"
cmx-authorize = "cmx_mcp.authorize:main"
cmx-mcp-http = "cmx_mcp.remote:main"
cmx-worker = "cmx_mcp.workers:main"

[project.optional-dependencies]
workers = [
  "faster-whisper>=1.1",
  "opencc-python-reimplemented>=0.1.7",
  "websockets>=14,<16",
]
vision = [
  "rapidocr>=3.9",
]
# The light subset the test suite imports directly: numpy for the Qwen
# audio-activity gate and opencc for the traditional->simplified pass. The
# full `workers` extra pulls faster-whisper/ctranslate2, which the tests fake,
# so CI installs only this to stay fast while still exercising both codepaths.
test = [
  "numpy>=1.26",
  "opencc-python-reimplemented>=0.1.7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
